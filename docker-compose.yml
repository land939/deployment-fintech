version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gta_fintech_db
    environment:
      POSTGRES_USER: gta_user
      POSTGRES_PASSWORD: gta_password
      POSTGRES_DB: gta_fintech
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gta_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gta_network

  redis:
    image: redis:7-alpine
    container_name: gta_fintech_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gta_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gta_fintech_api
    environment:
      DATABASE_URL: postgresql+asyncpg://gta_user:gta_password@postgres:5432/gta_fintech
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: production
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models:ro
    networks:
      - gta_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  gta_network:
    driver: bridge
