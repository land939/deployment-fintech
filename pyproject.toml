[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-fintech"
version = "2.0.0"
description = "Fintech Platform: Blockchain + AI Fraud Detection + Transaction Optimization"
requires-python = ">=3.12"
authors = [{ name = "GTA-IT Team", email = "dev@gta-fintech.local" }]
license = { text = "MIT" }

dependencies = [
    # FastAPI & Web
    "fastapi==0.109.2",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.6.3",
    "pydantic-settings==2.2.1",

    # Database
    "sqlalchemy==2.0.27",
    "aiosqlite==0.20.0",  # local / sans Docker
    "asyncpg==0.29.0",  # PostgreSQL (Docker / prod)
    "psycopg[binary]==3.1.18",
    "alembic==1.13.1",

    # ML & Data
    "scikit-learn==1.4.2",
    "xgboost==2.0.3",
    "pandas==2.2.1",
    "numpy==1.26.4",
    "imbalanced-learn==0.12.0",

    # Blockchain
    "web3==6.15.0",

    # Security & Auth
    "python-jose[cryptography]==3.3.0",
    "python-dotenv==1.0.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.x breaks on bcrypt>=4.1
    "email-validator==2.1.0",

    # Utils
    "python-multipart==0.0.6",
    "httpx==0.26.0",
    "joblib==1.3.2",
    "jinja2==3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.2",
    "pytest-cov==4.1.0",
    "ruff==0.15.21",
    "mypy==1.8.0",
    "bandit==1.7.6",
    "pylint==3.0.3",
    "black==24.1.1",
]

# Flat multi-package layout — setuptools won't auto-discover this
[tool.setuptools]
packages = [
    "config",
    "database",
    "services",
    "services.ml",
    "services.blockchain",
    "routers",
    "schemas",
    "utils",
]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["config", "database", "services", "routers", "schemas", "utils", "tests", "main.py"]
exclude = [
    "database/versions",
    ".venv",
    "venv",
    "migrations",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"database/__init__.py" = ["E402"]
"config/settings.py" = ["E501"]
"reset_db.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "database", "services", "routers", "schemas", "utils"]

[tool.ruff.lint.flake8-bugbear]
# Official Ruff/FastAPI approach when Depends appears as a default (Annotated preferred)
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = [
    "database/versions/",
    "venv/",
    ".venv/",
    "migrations/",
]

[[tool.mypy.overrides]]
module = [
    "web3.*",
    "xgboost.*",
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]

[tool.pylint.messages_control]
disable = ["C0111", "W0212", "R0903"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
# web3 registers pytest_ethereum; eth_typing 6.x breaks it — disable plugin
addopts = "-v -p no:pytest_ethereum --cov=. --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/migrations/*",
    ".venv/*",
    "venv/*",
    "templates/*",
    "static/*",
    "htmlcov/*",
    "train_fraud_model.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
