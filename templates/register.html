<!DOCTYPE html>
<html lang="fr">
<head>
  <title>GTA-IT Fintech — Inscription</title>
  {% include '_head.html' %}
</head>
<body class="auth">
  <button class="theme-toggle fab" onclick="toggleTheme()" title="Changer de thème" aria-label="Changer de thème"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>

  {% include '_authhero.html' %}
  <div class="auth-main">
  <div class="wrapper">

    <div class="logo">
      {% include '_brand.html' %}
      <h1>Plateforme Fintech Sécurisée</h1>
      <p>IA · Blockchain · Détection de Fraude</p>
    </div>

    <div class="card">
      <div class="card-bar"></div>
      <div class="card-body">

        <div class="card-header">
          <div class="card-title">Créer un compte</div>
          <div class="ftk-badge">+ 1 000 FTK offerts</div>
        </div>
        <div class="card-sub">Inscrivez-vous et rejoignez la plateforme</div>

        <div class="alert alert-error"   id="alertError"></div>
        <div class="alert alert-success" id="alertSuccess"></div>

        <form id="registerForm" novalidate>

          <div class="form-group">
            <label>Adresse Email</label>
            <input type="email" id="email" placeholder="vous@exemple.com" required />
          </div>

          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••" required />
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel"></div>
          </div>

          <div class="form-group">
            <label>Adresse Wallet <span>(Ethereum)</span></label>
            <div class="wallet-row">
              <input type="text" id="wallet" placeholder="0x..." required />
              <button type="button" class="btn-metamask" id="mmBtn">
                🦊 MetaMask
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">
            <span id="btnText">Créer mon compte</span>
            <div class="spinner" id="spinner"></div>
          </button>

        </form>

        <div class="footer-link">
          Déjà un compte ? <a href="/">Se connecter</a>
        </div>

      </div>
    </div>
  </div>
  </div><!-- /auth-main -->

  <script>
    /* ── Indicateur de force du mot de passe ── */
    document.getElementById('password').addEventListener('input', function () {
      const v = this.value;
      const fill  = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (v.length >= 8)          score++;
      if (/[A-Z]/.test(v))        score++;
      if (/[0-9]/.test(v))        score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const levels = [
        { pct: '0%',   color: '',        text: '' },
        { pct: '25%',  color: '#E5484D', text: 'Faible' },
        { pct: '50%',  color: '#FAB219', text: 'Moyen' },
        { pct: '75%',  color: '#3987E5', text: 'Fort' },
        { pct: '100%', color: '#30B96E', text: 'Très fort' },
      ];
      const lv = v.length === 0 ? levels[0] : levels[score] || levels[1];
      fill.style.width      = lv.pct;
      fill.style.background = lv.color;
      label.textContent     = lv.text;
      label.style.color     = lv.color;
    });

    /* ── Détection MetaMask ── */
    document.getElementById('mmBtn').addEventListener('click', async () => {
      if (typeof window.ethereum === 'undefined') {
        showError('MetaMask non détecté — installez MetaMask ou saisissez l\'adresse manuellement.');
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        document.getElementById('wallet').value = accounts[0];
      } catch {
        showError('Connexion MetaMask refusée.');
      }
    });

    /* ── Soumission du formulaire ── */
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const wallet   = document.getElementById('wallet').value.trim();
      const btn      = document.getElementById('submitBtn');
      const spinner  = document.getElementById('spinner');
      const btnText  = document.getElementById('btnText');

      btnText.style.display = 'none';
      spinner.style.display = 'block';
      btn.disabled = true;

      try {
        const res  = await fetch('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, wallet_address: wallet })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token',  data.access_token);
          localStorage.setItem('wallet', data.wallet);
          showSuccess('✓ ' + (data.message || 'Compte créé avec succès !'));
          setTimeout(() => { window.location.href = '/dashboard'; }, 1400);
        } else {
          showError('⚠ ' + (data.error || 'Erreur lors de la création du compte.'));
          btn.disabled = false;
        }
      } catch {
        showError('⚠ Impossible de joindre le serveur.');
        btn.disabled = false;
      } finally {
        btnText.style.display = 'block';
        spinner.style.display = 'none';
      }
    });

    function showError(msg)   { const el = document.getElementById('alertError');   el.textContent = msg; el.style.display = 'block'; }
    function showSuccess(msg) { const el = document.getElementById('alertSuccess'); el.textContent = msg; el.style.display = 'block'; }
    function clearAlerts()    {
      document.getElementById('alertError').style.display   = 'none';
      document.getElementById('alertSuccess').style.display = 'none';
    }
  </script>
</body>
</html>
