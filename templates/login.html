<!DOCTYPE html>
<html lang="fr">
<head>
  <title>GTA-IT Fintech Connexion</title>
  {% include '_head.html' %}
</head>
<body class="auth">
  <button class="theme-toggle fab" onclick="toggleTheme()" title="Changer de thème" aria-label="Changer de thème"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>

  {% include '_authhero.html' %}
  <div class="auth-main">
  <div class="login-wrapper">
    <div class="logo">
      {% include '_brand.html' %}
      <h1>Plateforme Fintech Sécurisée</h1>
      <p>IA · Blockchain · Détection de Fraude</p>
    </div>

    <div class="card">
      <div class="card-top-bar"></div>
      <div class="card-inner">
        <div class="card-title">Connexion</div>
        <div class="card-sub">Accédez à votre tableau de bord</div>

        <div class="error-msg" id="errorMsg">⚠ Identifiants incorrects</div>

        <form id="loginForm">
          <div class="form-group">
            <label>Adresse Email</label>
            <input type="email" id="email" placeholder="vous@exemple.com" required />
          </div>
          <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••" required />
            <div style="text-align:right; margin-top:0.45rem;">
              <a href="/forgot-password" style="font-family:var(--mono); font-size:0.68rem; color:var(--gray); text-decoration:none;">
                Mot de passe oublié ?
              </a>
            </div>
          </div>
          <button type="submit" class="btn" id="loginBtn">
            <span id="btnText">Se connecter</span>
            <div class="spinner" id="spinner"></div>
          </button>
        </form>

        <div class="divider">ou</div>

        <button class="btn-outline" id="metamaskBtn">
          🦊 Connexion avec MetaMask
        </button>

        <div class="footer-link">
          Pas encore de compte ? <a href="/register">Créer un compte</a>
        </div>
      </div>
    </div>
  </div>
  </div><!-- /auth-main -->

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn     = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorMsg= document.getElementById('errorMsg');

      btnText.style.display  = 'none';
      spinner.style.display  = 'block';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email    : document.getElementById('email').value,
            password : document.getElementById('password').value
          })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token',  data.access_token);
          localStorage.setItem('wallet', data.wallet);
          localStorage.setItem('email',  data.email  || '');
          localStorage.setItem('role',   data.role   || 'user');
          window.location.href = data.role === 'superadmin' ? '/superadmin' : '/dashboard';
        } else {
          const msg = data.error
            || (typeof data.detail === 'string' ? data.detail : null)
            || (Array.isArray(data.detail) ? data.detail.map(d => d.msg).join(' · ') : null)
            || 'Identifiants incorrects';
          errorMsg.textContent   = '⚠ ' + msg;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent   = '⚠ Erreur de connexion au serveur';
        errorMsg.style.display = 'block';
      } finally {
        btnText.style.display = 'block';
        spinner.style.display = 'none';
      }
    });

    document.getElementById('metamaskBtn').addEventListener('click', async () => {
      if (typeof window.ethereum === 'undefined') {
        alert('MetaMask non détecté — installez MetaMask pour continuer');
        return;
      }
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const wallet   = accounts[0];

        // 1. Demander un message unique (nonce) au serveur
        const nonceRes  = await fetch('/auth/metamask-nonce', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wallet_address: wallet })
        });
        const nonceData = await nonceRes.json();
        if (!nonceRes.ok) {
          alert(nonceData.error || 'Erreur lors de la demande de nonce');
          return;
        }

        // 2. Signer le message avec MetaMask (preuve de possession du wallet)
        const signature = await window.ethereum.request({
          method: 'personal_sign',
          params: [nonceData.message, wallet]
        });

        // 3. Envoyer wallet + signature pour obtenir le JWT
        const res = await fetch('/auth/login-metamask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wallet_address: wallet, signature })
        });

        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token',  data.access_token);
          localStorage.setItem('wallet', wallet);
          window.location.href = '/dashboard';
        } else {
          alert(data.error || 'Erreur de connexion MetaMask');
        }
      } catch (err) {
        alert('Connexion MetaMask annulée');
      }
    });
  </script>
</body>
</html>
