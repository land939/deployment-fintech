<!DOCTYPE html>
<html lang="fr">
<head>
  <title>GTA-IT Fintech — Mot de passe oublié</title>
  {% include '_head.html' %}
</head>
<body class="auth">
  <button class="theme-toggle fab" onclick="toggleTheme()" title="Changer de thème" aria-label="Changer de thème"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>

  {% include '_authhero.html' %}
  <div class="auth-main">
  <div class="wrapper">
    <div class="logo">
      {% include '_brand.html' %}
      <h1>Plateforme Fintech Sécurisée</h1>
      <p>IA · Blockchain · Détection de Fraude</p>
    </div>

    <div class="card">
      <div class="card-bar"></div>
      <div class="card-body">
        <div class="card-title">Mot de passe oublié ?</div>
        <div class="card-sub">Saisissez votre email et un lien de réinitialisation valable 30 minutes vous sera envoyé.</div>

        <div class="alert alert-error"   id="alertError"></div>
        <div class="alert alert-success" id="alertSuccess"></div>

        <form id="forgotForm">
          <div class="form-group">
            <label>Adresse Email</label>
            <input type="email" id="email" placeholder="vous@exemple.com" required />
          </div>
          <button type="submit" class="btn" id="submitBtn">
            <span id="btnText">Envoyer le lien</span>
            <div class="spinner" id="spinner"></div>
          </button>
        </form>

        <div class="footer-link">
          <a href="/">← Retour à la connexion</a>
        </div>
      </div>
    </div>
  </div>
  </div><!-- /auth-main -->

  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn      = document.getElementById('submitBtn');
      const spinner  = document.getElementById('spinner');
      const btnText  = document.getElementById('btnText');
      const errEl    = document.getElementById('alertError');
      const okEl     = document.getElementById('alertSuccess');

      errEl.style.display = 'none';
      okEl.style.display  = 'none';
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      btn.disabled = true;

      try {
        const res  = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const data = await res.json();

        okEl.textContent   = data.message || 'Si un compte existe, un email a été envoyé.';
        okEl.style.display = 'block';
        document.getElementById('forgotForm').reset();
      } catch (err) {
        errEl.textContent   = '⚠ Impossible de joindre le serveur.';
        errEl.style.display = 'block';
      } finally {
        btnText.style.display = 'block';
        spinner.style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
