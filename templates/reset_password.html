<!DOCTYPE html>
<html lang="fr">
<head>
  <title>GTA-IT Fintech — Nouveau mot de passe</title>
  {% include '_head.html' %}
</head>
<body class="auth">
  <button class="theme-toggle fab" onclick="toggleTheme()" title="Changer de thème" aria-label="Changer de thème"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>

  {% include '_authhero.html' %}
  <div class="auth-main">
  <div class="wrapper">
    <div class="logo">
      <div class="logo-mark">
        <span class="logo-gta">GTA</span><span class="logo-sep">-</span><span class="logo-it">IT</span>
      </div>
      <h1>Plateforme Fintech Sécurisée</h1>
      <p>IA · Blockchain · Détection de Fraude</p>
    </div>

    <div class="card">
      <div class="card-bar"></div>
      <div class="card-body">
        <div class="card-title">Nouveau mot de passe</div>
        <div class="card-sub">Choisissez un nouveau mot de passe pour votre compte.</div>

        <div class="alert alert-error"   id="alertError"></div>
        <div class="alert alert-success" id="alertSuccess"></div>

        <form id="resetForm">
          <div class="form-group">
            <label>Nouveau mot de passe</label>
            <input type="password" id="password" placeholder="••••••••" required />
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-label" id="strengthLabel"></div>
          </div>
          <div class="form-group">
            <label>Confirmer le mot de passe</label>
            <input type="password" id="confirm" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn" id="submitBtn">
            <span id="btnText">Réinitialiser le mot de passe</span>
            <div class="spinner" id="spinner"></div>
          </button>
        </form>

        <div class="footer-link">
          <a href="/">← Retour à la connexion</a>
        </div>
      </div>
    </div>
  </div>
  </div><!-- /auth-main -->

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      document.getElementById('resetForm').style.display = 'none';
      showError('Lien invalide : aucun token trouvé dans l\'URL. Refaites une demande depuis "Mot de passe oublié".');
    }

    document.getElementById('password').addEventListener('input', function () {
      const v = this.value;
      const fill  = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      let score = 0;
      if (v.length >= 8)          score++;
      if (/[A-Z]/.test(v))        score++;
      if (/[0-9]/.test(v))        score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;

      const levels = [
        { pct: '0%',   color: '',        text: '' },
        { pct: '25%',  color: '#E5484D', text: 'Faible' },
        { pct: '50%',  color: '#FAB219', text: 'Moyen' },
        { pct: '75%',  color: '#3987E5', text: 'Fort' },
        { pct: '100%', color: '#30B96E', text: 'Très fort' },
      ];
      const lv = v.length === 0 ? levels[0] : levels[score] || levels[1];
      fill.style.width      = lv.pct;
      fill.style.background = lv.color;
      label.textContent     = lv.text;
      label.style.color     = lv.color;
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlerts();

      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm').value;

      if (password !== confirm) {
        showError('⚠ Les deux mots de passe ne correspondent pas.');
        return;
      }

      const btn     = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      btn.disabled = true;

      try {
        const res  = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (res.ok) {
          showSuccess('✓ ' + (data.message || 'Mot de passe réinitialisé.'));
          document.getElementById('resetForm').style.display = 'none';
          setTimeout(() => { window.location.href = '/'; }, 1800);
        } else {
          showError('⚠ ' + (data.error || 'Erreur lors de la réinitialisation.'));
          btn.disabled = false;
        }
      } catch (err) {
        showError('⚠ Impossible de joindre le serveur.');
        btn.disabled = false;
      } finally {
        btnText.style.display = 'block';
        spinner.style.display = 'none';
      }
    });

    function showError(msg)   { const el = document.getElementById('alertError');   el.textContent = msg; el.style.display = 'block'; }
    function showSuccess(msg) { const el = document.getElementById('alertSuccess'); el.textContent = msg; el.style.display = 'block'; }
    function clearAlerts() {
      document.getElementById('alertError').style.display   = 'none';
      document.getElementById('alertSuccess').style.display = 'none';
    }
  </script>
</body>
</html>
